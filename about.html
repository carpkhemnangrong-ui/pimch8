<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติวิทยาลัย - วิทยาลัยเทคนิคนางรอง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <div class="bg-maroon text-white py-4 px-6 flex justify-between items-center border-b-4 border-gold">
    <h1 class="font-bold text-xl">About : ประวัติวิทยาลัย</h1>
    <a href="index.html" class="bg-gold text-maroon font-bold px-4 py-1.5 rounded text-xs hover:bg-yellow-400">
      <i class="fa-solid fa-house"></i> ย้อนกลับหน้าหลัก
    </a>
  </div>

  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow">
    <div class="bg-white p-6 rounded-2xl shadow border-l-4 border-maroon mb-6">
      <h2 class="text-2xl font-bold text-maroon mb-4">ประวัติความเป็นมา</h2>
      <!-- ใส่รูปภาพวิทยาลัยจริงตรงนี้ -->
      <img src="images/hero-bg.jpg" alt="วิทยาลัยเทคนิคนางรอง" class="w-full h-64 object-cover rounded-xl mb-4 border border-slate-200">
      <p class="text-slate-700 leading-relaxed text-sm mb-4">
        วิทยาลัยเทคนิคนางรอง ตั้งอยู่ในอำเภอนางรอง จังหวัดบุรีรัมย์ จัดตั้งขึ้นเพื่อรองรับการขยายตัวทางเทคโนโลยีและสายอาชีพในภูมิภาค มุ่งเน้นการผลิตบุคลากรที่มีคุณภาพ มีวินัย และทักษะวิชาชีพตรงตามความต้องการของตลาดแรงงาน
      </p>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
