<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สิ่งอำนวยความสะดวก - วิทยาลัยเทคนิคนางรอง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <div class="bg-maroon text-white py-4 px-6 flex justify-between items-center border-b-4 border-gold">
    <h1 class="font-bold text-xl">Facilities : สิ่งอำนวยความสะดวก</h1>
    <a href="index.html" class="bg-gold text-maroon font-bold px-4 py-1.5 rounded text-xs hover:bg-yellow-400">
      <i class="fa-solid fa-house"></i> ย้อนกลับหน้าหลัก
    </a>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <div class="bg-white p-5 rounded-2xl shadow border border-slate-100">
        <i class="fa-solid fa-wifi text-3xl text-maroon mb-3"></i>
        <h3 class="font-bold text-slate-800">อินเทอร์เน็ตไร้สาย (Wi-Fi)</h3>
        <p class="text-xs text-slate-600 mt-1">ให้บริการความเร็วสูงทั่วทุกพื้นที่ในวิทยาลัย</p>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow border border-slate-100">
        <i class="fa-solid fa-utensils text-3xl text-maroon mb-3"></i>
        <h3 class="font-bold text-slate-800">ศูนย์อาหารและโรงอาหาร</h3>
        <p class="text-xs text-slate-600 mt-1">สะอาด ถูกสุขอนามัย ราคานักเรียนนักศึกษา</p>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow border border-slate-100">
        <i class="fa-solid fa-book-reader text-3xl text-maroon mb-3"></i>
        <h3 class="font-bold text-slate-800">วิทยบริการ (ห้องสมุด)</h3>
        <p class="text-xs text-slate-600 mt-1">แหล่งเรียนรู้ ค้นคว้า หนังสือ และสืบค้นออนไลน์</p>
      </div>

    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
